<title>Ammiraglia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: gioco mobile pensato in orizzontale — barra laterale con icone, schede a due colonne; in verticale la barra scende in basso */
:root{
  --bg:#E9EDEA; --surface:#FFFFFF; --sunk:#DEE4DF; --ink:#141E26; --muted:#5A6870; --line:#CFD7D1;
  --accent:#1D4ED1; --accent-soft:#DAE3FB; --on-accent:#FFFFFF;
  --amber:#D18F00; --amber-soft:#F7E8BF; --danger:#BE3329; --ok:#23804A; --ok-soft:#D5EEDC;
  --terrain:#C1CFBC; --terrain-edge:#6A856B; --kom:#B4322A; --pave:#6B5B4B; --gravel:#B88A4A;
  --rail:#121B22; --rail-ink:#AFC0C9; --rail-on:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --shadow:0 1px 0 rgba(20,30,38,.06),0 2px 8px rgba(20,30,38,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1317; --surface:#162027; --sunk:#10191E; --ink:#E5EBED; --muted:#8C9CA4; --line:#24323A;
  --accent:#6E95FF; --accent-soft:#1E2C52; --on-accent:#0A1020;
  --amber:#F0BB3C; --amber-soft:#3A3016; --danger:#F06A5E; --ok:#5CC27E; --ok-soft:#173826;
  --terrain:#2B3C34; --terrain-edge:#7FA287; --kom:#F06A5E; --pave:#A99682; --gravel:#D9A766;
  --rail:#080D10; --rail-ink:#7F919A; --rail-on:#FFFFFF; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#162027; --sunk:#10191E; --ink:#E5EBED; --muted:#8C9CA4; --line:#24323A;
  --accent:#6E95FF; --accent-soft:#1E2C52; --on-accent:#0A1020;
  --amber:#F0BB3C; --amber-soft:#3A3016; --danger:#F06A5E; --ok:#5CC27E; --ok-soft:#173826;
  --terrain:#2B3C34; --terrain-edge:#7FA287; --kom:#F06A5E; --pave:#A99682; --gravel:#D9A766;
  --rail:#080D10; --rail-ink:#7F919A; --rail-on:#FFFFFF; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h2{font-size:24px}h3{font-size:18px;display:flex;align-items:center;gap:6px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.note{font-size:13px;color:var(--muted)}
.neg{color:var(--danger)!important}.pos{color:var(--ok)!important}
.ic{flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.fr{display:flex;gap:8px;align-items:center;justify-content:flex-end;width:100%;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 16px;border-radius:10px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);color:var(--ink);transition:transform .08s ease,filter .15s}
.btn:active:not(:disabled){transform:translateY(1px) scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000);transform:translateY(2px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.big{min-height:50px;font-size:18px;padding:0 22px}
.btn.sm{min-height:34px;font-size:14px;padding:0 12px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.u23{background:var(--accent-soft);color:var(--accent)}
.chip.cls{background:var(--ink);color:var(--bg)}
.chip.cat{background:var(--accent);color:var(--on-accent)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:transparent;color:var(--danger);box-shadow:inset 0 0 0 1px currentColor}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:12px 14px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.bar.e>i{background:var(--ok)}.bar.w>i{background:var(--amber)}.bar.f>i{background:var(--danger)}
.cond{display:inline-flex;align-items:center;gap:5px}
.cond::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv.kv4{grid-template-columns:repeat(2,minmax(0,1fr))}
.kv>div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0}
.kv small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv b{font-family:var(--f-display);font-size:22px}
.sec{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13.5px;text-align:left;width:100%}
.banner.closed{background:var(--sunk)}
.rotate{display:none;margin-bottom:12px}
@media (orientation:portrait) and (max-width:600px){.rotate{display:flex}}
.cols{display:flex;flex-direction:column;gap:10px}
.cols1{display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:10px;font-size:14px;background:var(--sunk)}
.msg.ok{background:var(--ok-soft)}.msg.no{background:color-mix(in srgb,var(--danger) 14%,transparent)}
.big2{font-family:var(--f-display);font-weight:700;font-size:26px}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px;padding-block:8px}
.crest{width:42px;height:42px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.tn{font-family:var(--f-display);font-weight:800;font-size:20px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hud{margin-left:auto;display:flex;gap:14px;text-align:right}
.hud small{display:block;font-size:10.5px;color:var(--muted);font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.hud b{font-family:var(--f-display);font-size:19px}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);flex:none}
main.view{padding-block:14px 110px}
main.view.enter{animation:enter .22s ease-out}
@keyframes enter{from{transform:translateY(6px)}to{transform:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--rail);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabin{display:grid;grid-template-columns:repeat(7,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.seg{overflow-x:auto;scrollbar-width:none;max-width:100%}.seg::-webkit-scrollbar{display:none}.seg button{flex-shrink:0}
.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs button{min-width:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--rail-ink);font-family:var(--f-display);font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.tabs button[aria-current="true"]{color:var(--rail-on)}
.tabs button[aria-current="true"] .ic{color:var(--amber)}
.badge{position:absolute;top:4px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-family:var(--f-body);display:grid;place-items:center}

/* intro */
.intro{display:flex;flex-direction:column;gap:16px;padding-block:24px}
.introL{display:flex;flex-direction:column;gap:12px}
.intro h1{font-size:54px;font-weight:800;line-height:.9}
.intro p{margin:0;max-width:60ch;font-size:16px}
.introR{padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.filters select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.jerseys{display:flex;gap:6px;flex-wrap:wrap}
.jbtn{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--sunk);border:2px solid transparent}
.jbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}

/* home */
.homegrid,.basegrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{padding:16px;display:flex;flex-direction:column;gap:10px;border-width:2px}
.hero.go{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.hero h2{font-size:28px}
.herorace{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:6px}
.offer{padding:12px;border-radius:12px;background:var(--amber-soft);display:flex;flex-direction:column;gap:4px}
.offer b{font-family:var(--f-display);font-size:22px}
.obj{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
.obj:first-of-type{border-top:0}
.obj .ol{grid-column:1/-1;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.obj .ol b{font-family:var(--f-display);color:var(--amber);font-size:16px;white-space:nowrap}
.obj.done .ol b{color:var(--ok)}
.obj .bar{grid-column:1}
.obj small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mails{display:flex;flex-direction:column}
.mail{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 2px;border-top:1px solid var(--line);text-align:left}
.mail:first-child{border-top:0}
.mail .from{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mail .mt2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.mail .wk{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.mail.unread .mt2{font-weight:700}
.mail.unread .from::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:5px;vertical-align:1px}
.mailbody{font-size:15px;line-height:1.55;max-width:65ch}
.recent{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);width:100%;text-align:left;font-size:14px}
.recent:first-of-type{border-top:0}
.recent .rn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}

/* calendario */
/* GRAFICA */
.flag{display:inline-block;vertical-align:-2px;border-radius:2px;flex:none}
.av{display:inline-block;vertical-align:middle;border-radius:50%;flex:none}
.pc{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}.pcn{min-width:0}.pcl{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.t.dt .pcs{padding-left:38px}
.ic2{display:inline-block;vertical-align:middle;flex:none}
.aic{color:var(--muted);display:inline-flex}.ric{display:inline-flex;margin-left:3px;color:var(--muted)}.ric.r_cap{color:var(--amber)}.ric.r_luog{color:#A8A29E}.ric.r_free{color:var(--accent)}.ric.r_svil{color:var(--ok)}
.tic{display:inline-flex;color:var(--muted)}.rcn{display:inline-flex;align-items:center;gap:6px}
.ii{display:inline-flex;margin-left:2px;color:var(--muted)}.ii.neg{color:var(--danger)}
.fit2{display:inline-block;width:52px;height:7px;border-radius:4px;background:var(--sunk);overflow:hidden;vertical-align:middle}.fit2 i{display:block;height:100%}
.dashrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;font-size:14px}.dashrow span:nth-child(2){flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dashrow .go{color:var(--muted);font-size:20px}
.phav{position:relative;flex:none;margin-right:10px}.phfl{position:absolute;right:-4px;bottom:0}
.sheet .ph{align-items:center}
.herorace h2 .flag{vertical-align:0}
.recent .flag{margin-right:6px}
/* TABELLE */
.dtw{overflow-x:auto}
.t.dt{width:100%;border-collapse:collapse}
.t.dt td{padding:7px 8px;vertical-align:middle}
.t.dt tr.th td{padding-block:6px;font-size:10.5px;font-family:var(--f-display);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;background:var(--sunk)}
.t.dt tr[data-act]{cursor:pointer}.t.dt tr[data-act]:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.t.dt b{font-weight:650}.t.dt .tm{font-size:11.5px;color:var(--muted);margin-top:1px}
.t.dt .chip{font-size:10px;padding:1px 6px}
.ov{display:inline-grid;place-items:center;min-width:30px;height:24px;border-radius:7px;background:var(--sunk);font-family:var(--f-mono);font-size:13.5px}.ov.hi{background:var(--accent);color:var(--on-accent)}
.t.dt small.tr{display:block;font-size:10.5px}.t.dt .tr.up{color:var(--ok)}.t.dt .tr.down{color:var(--danger)}
.mb{display:inline-block;vertical-align:middle;width:56px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.mb i{display:block;height:100%;background:var(--accent)}.mb.ok i{background:var(--ok)}
.t.dt td .mb{width:100%;max-width:120px}
.t.dt tr.wkr td{background:var(--sunk);font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-block:5px}
.t.dt tr.wkr.now td{color:var(--accent)}
.t.dt tr.past td{opacity:.75}
.t.dt tr.okr td{background:var(--ok-soft)}
.t.dt.cal .mt{margin-top:3px}
.t.dt .pos{color:var(--ok)}.t.dt .neg{color:var(--danger)}
.nowrap{white-space:nowrap}
.stars{color:var(--amber);font-size:12px;letter-spacing:-1px}
@media (max-width:640px){.t.dt .hs{display:none}}
@media (max-width:480px){.t.dt .hm{display:none}}
/* numeri in riga (niente riquadri), tranne palmarès e scheda corridore */
.kv:not(.keep){gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv:not(.keep)>div{background:none;border:0;border-radius:0;border-left:1px solid var(--line)}
.kv:not(.keep)>div:first-child{border-left:0}
.pkhero{margin-bottom:14px}
.t.dt.tac tr.sel td{background:var(--accent-soft)}.t.dt.tac td.c{text-align:center;width:44px}.tradio{padding:6px}.tsel{width:100%;min-width:120px;max-width:230px;font:inherit;font-size:13px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.t.dt.gtab td{vertical-align:top;padding:9px 10px}.t.dt.gtab td.gk{width:24%;min-width:110px}.t.dt.gtab td.gtx{font-size:13.5px;line-height:1.5;color:var(--ink)}
.t.dt.sltab td .mb{width:40px}.t.dt.sltab td{white-space:nowrap}.t.dt.sltab tr.sel td{background:var(--accent-soft)}.t.dt.sltab tr.off td{opacity:.5}
.radio{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);vertical-align:middle}.radio.on{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.t.dt.trk td.c{text-align:center;width:84px;padding:5px 4px;white-space:nowrap}.t.dt.trk{table-layout:fixed}.t.dt.trk td:first-child{width:auto}.t.dt.trk tr.sub td{background:none;font-family:var(--f-mono);font-size:11.5px;text-transform:none}
.tkc{width:72px;height:32px;padding:0;border-radius:8px;background:var(--sunk);font-family:var(--f-mono);font-size:13.5px;border:2px solid transparent}.tkc.best{color:var(--accent);font-weight:700}.tkc[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.t.dt.conv tr.off td{opacity:.55}.t.dt.conv tr.sel td{background:color-mix(in srgb,var(--accent) 5%,transparent)}.t.dt.conv input{width:20px;height:20px}.t.dt.conv label{cursor:pointer;display:block}.t.dt.conv .star{width:32px;height:32px}
.awgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.aw{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;text-align:left}
.aw small{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--muted)}
.aw b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.aw span{font-size:12px;color:var(--muted)}
.aw.me{background:var(--amber-soft)}.aw .chip{margin-top:3px}
.awb{margin:12px 0}
.xpline{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}.xpline small{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.xpb{height:7px;border-radius:4px;background:var(--sunk);overflow:hidden}.xpb i{display:block;height:100%;background:var(--amber)}
.xpc{display:inline-block;padding:0 5px;border-radius:5px;background:var(--amber-soft);color:var(--amber);font-weight:700;font-size:10.5px}
.t tr.th td{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.t.car td{font-size:13px;padding-block:5px}
.stgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.stc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto;gap:4px 10px;align-items:center;padding:10px 12px}
.stc>.ic{grid-row:span 2;color:var(--accent)}
.stm{display:flex;flex-direction:column;min-width:0}.stm small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.stm b{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stm span{font-size:12px;color:var(--muted)}
.stm span.up{color:var(--ok)}.stm span.dn{color:var(--danger)}
.stq{display:flex;align-items:center;gap:6px;justify-self:end}.qb{width:54px;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}.qb i{display:block;height:100%;background:var(--accent)}
.sts{grid-column:2 / 4;display:flex;align-items:center;justify-content:space-between;gap:8px}.sts small{font-size:12px;color:var(--muted)}
.stc.empty{background:var(--sunk);box-shadow:none}
.stdur{max-width:260px}
.mom{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:color-mix(in srgb,#000 35%,transparent);padding:12px;animation:momin .18s ease-out}
@keyframes momin{from{opacity:0}to{opacity:1}}
.momc{width:min(720px,100%);background:var(--surface);border-radius:18px;padding:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;animation:momup .22s ease-out}
@keyframes momup{from{transform:translateY(30px)}to{transform:none}}
.momh{display:flex;gap:12px;align-items:center}.momh b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}.momh small{color:var(--muted);font-size:13px}
.mi{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;background:var(--amber);color:#fff;font-size:22px;flex:none}
.momo{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.momb{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:12px;border-radius:12px;background:var(--sunk);border:2px solid transparent;text-align:left;min-height:64px}
.momb b{font-size:15.5px}.momb small{font-size:12px;color:var(--muted)}.momb.rec{border-color:var(--amber)}
.momb:active{transform:scale(.98)}
.momt{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}.momt i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.teambar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin-bottom:8px}
.teambar button{display:flex;flex-direction:column;align-items:flex-start;padding:7px 8px;border-radius:10px;background:var(--sunk);border:2px solid transparent;text-align:left;min-width:0}
.teambar b{font-size:12.5px;line-height:1.15}.teambar small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.teambar button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.momsw{font-size:12px!important}.momsw[aria-pressed="false"]{opacity:.6}
.pag .pr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 8px;padding:5px 0;border-top:1px solid var(--line)}
.pag .pr:first-of-type{border-top:0}.pag .pr small{grid-column:2;font-size:11.5px;color:var(--muted)}
.pgv{grid-row:span 2;display:grid;place-items:center;height:34px;border-radius:9px;background:var(--sunk);font-family:var(--f-mono);font-size:16px}
.pgv.hi{background:var(--ok-soft);color:var(--ok)}.pgv.lo{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.note.clip{display:none!important}
.pkhero{gap:10px;margin-bottom:14px}
.pkgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:640px){.pkgrid{grid-template-columns:minmax(0,1fr)}}
.pk{display:flex;flex-direction:column;gap:8px;padding:12px;text-align:left;border:2px solid transparent}
.pk:hover,.pk:focus-visible{border-color:var(--accent)}
.pkh{display:flex;align-items:center;gap:8px}.pkh b{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.pk>small{color:var(--muted);font-size:12px;line-height:1.3}
.pkn{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.pkn div{display:flex;flex-direction:column}.pkn b{font-family:var(--f-mono);font-size:17px}.pkn small{font-size:11px;color:var(--muted)}
.mixbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--sunk)}.mixbar i{display:block;height:100%}
.mixlg{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11px;color:var(--muted)}.mixlg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.pktop{display:flex;flex-direction:column;gap:2px;font-size:12.5px}.pktop span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pklist{display:flex;flex-direction:column}.pkr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 8px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.pkr .wk{grid-row:span 2;font-family:var(--f-mono);color:var(--muted);font-size:13px}.pkr .rn{font-weight:600}
.clubtop{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:14px}
@media (max-width:760px){.clubtop{grid-template-columns:minmax(0,1fr)}}
.facgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.fac{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--sunk);box-shadow:none}.fac.on{background:var(--accent-soft)}
.fh{display:flex;align-items:center;gap:6px}.fh b{font-size:13.5px;flex:1;min-width:0}.lv{color:var(--accent);font-size:11px;letter-spacing:1px}
.fac small{font-size:11.5px;color:var(--muted);line-height:1.3}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ach{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;padding:7px 8px;border-radius:9px;background:var(--sunk);color:var(--muted);font-size:12.5px}
.ach span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ach small{font-family:var(--f-mono);font-size:11px}
.ach.ok{background:var(--ok-soft);color:var(--ink)}
.chip.fem{background:color-mix(in srgb,#C2185B 16%,transparent);color:#C2185B}
.sidebtn{height:38px;padding:0 12px;font-size:13px;white-space:nowrap}
.gchip{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;font-size:12px;font-weight:800;color:#fff;background:var(--accent);vertical-align:middle}
.gchip.gB{background:var(--amber)}.gchip.gC{background:var(--ok)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.gcard{border-top:4px solid var(--accent)}.gcard.gB{border-top-color:var(--amber)}.gcard.gC{border-top-color:var(--ok)}
.ghead{display:flex;align-items:center;gap:8px}
.gname{flex:1;min-width:0;font:inherit;font-weight:700;font-size:16px;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:4px 0}
.gm{display:flex;flex-direction:column}
.grr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.grr:first-child{border-top:0}
.gnm{text-align:left;min-width:0;display:flex;align-items:center;gap:8px}.gnm>span{min-width:0}.gnm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gnm small{font-size:11.5px;color:var(--muted)}
.gsc{font-size:13px;color:var(--muted)}
.gsw{display:flex;gap:3px}.gsw button{width:30px;height:30px;border-radius:8px;background:var(--sunk);font-weight:700;font-size:13px}
.gsw button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.grow{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.trackgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.fchip{padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.04em;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.callist{display:flex;flex-direction:column;gap:6px}
.wk{font-family:var(--f-display);font-size:14px;color:var(--muted);padding:10px 2px 2px;letter-spacing:.04em;scroll-margin-top:80px}
.wk b{color:var(--ink);text-transform:uppercase;letter-spacing:.08em;margin-right:6px}
.wk.now b{color:var(--accent)}
.rrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.rrow.past{opacity:.72}
.rmain{flex:1;min-width:0}
.rn{font-weight:700;font-size:15.5px;line-height:1.2}
.mt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px;font-size:12.5px}
.pill{flex:none;display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;font-family:var(--f-display);font-weight:700;font-size:14px;white-space:nowrap;max-width:44%;overflow:hidden;text-overflow:ellipsis}
.pill.fee{background:var(--accent);color:var(--on-accent)}
.pill.inv{background:var(--amber-soft);color:var(--amber)}
.pill.reg{background:var(--ok-soft);color:var(--ok)}
.pill.lock,.pill.no{background:var(--sunk);color:var(--muted)}
.pill.done{background:transparent;color:var(--muted);font-weight:600}
.pill.done.me{color:var(--accent)}
.stbars{display:inline-flex;align-items:flex-end;gap:2px;height:16px}
.stbars i{display:block;width:4px;border-radius:1px;background:var(--terrain-edge)}
.stbars i.tt{background:var(--accent)}.stbars i.pv{background:var(--pave)}
.rsgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.stages{display:flex;flex-direction:column;gap:6px}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.stage .sl{display:flex;gap:8px;font-size:13.5px}
.stage .sl b{font-family:var(--f-display);min-width:16px}
.minip{display:block}
.sv-t{fill:var(--terrain)}.sv-l{fill:none;stroke:var(--terrain-edge);stroke-width:1.2}.sv-pave{fill:var(--pave)}.sv-grav{fill:var(--gravel)}
.rsside{display:flex;flex-direction:column;gap:10px}

/* squadra e mercato */
.rider{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:6px 10px;padding:12px;text-align:left;width:100%;align-items:center}
.rider .nm,.mrow .nm,.jrow .nm{font-weight:700;font-size:15.5px}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:3px;font-size:12.5px;color:var(--muted)}
.rr2{text-align:right;font-size:13px;display:flex;flex-direction:column;align-items:flex-end}
.rr2 small{color:var(--muted)}
.statrow{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.stat{display:flex;flex-direction:column;gap:3px}
.stat small{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.stat b{font-family:var(--f-display);font-size:17px;line-height:1}
.cline{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ovr{width:44px;height:44px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:21px}
.ovr.hi{background:var(--accent);color:var(--on-accent)}
.mrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;width:100%;text-align:left}
.mrow .pr{text-align:right;font-family:var(--f-mono);font-size:13.5px;white-space:nowrap}
.mrow .pr small{display:block;font-family:var(--f-body);color:var(--muted);font-size:11.5px;white-space:normal;max-width:150px}
.seg{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:11px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-family:var(--f-display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{font-size:14px;padding:7px 9px}
.stepper{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;gap:6px;margin-top:5px}
.stepper button{height:46px;border-radius:10px;background:var(--sunk);font-size:22px;font-weight:700}
.eurin{display:flex;align-items:center;gap:4px;background:var(--sunk);border-radius:10px;padding:0 10px;height:46px}
.eurin span{font-family:var(--f-mono);color:var(--muted)}
.eurin input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--f-mono);font-size:18px;text-align:center;color:var(--ink);-moz-appearance:textfield}
.eurin input::-webkit-outer-spin-button,.eurin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper output{text-align:center;font-family:var(--f-mono);font-size:18px}
.negbox{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* strutture */
.camps{display:flex;flex-direction:column;gap:8px}
.camp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;align-items:center}
.camp .cm{display:flex;flex-direction:column}
.camp .cm b{font-family:var(--f-display);font-size:18px}
.camp .ca{grid-column:1;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.camp .alt{font-family:var(--f-display);font-weight:800;font-size:17px;color:var(--accent)}
.camp .btn{grid-row:1/span 2;grid-column:2}
.levels{display:flex;gap:5px}
.levels i{flex:1;height:10px;border-radius:5px;background:var(--sunk)}
.levels i.on{background:var(--amber)}
.jrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px}

/* tabelle */
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t td,.t th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t td.n{width:32px;font-family:var(--f-mono);color:var(--muted)}
.t td.r{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t tr.me td{background:var(--accent-soft)}
.t .tm{font-size:12px;color:var(--muted)}
.tbl{overflow-x:auto;padding:2px 8px}
.jl{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);margin-top:6px}
.jer{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}

/* fogli */
.sheet{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:620px;max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .2s ease-out}
.sheet .panel>*{width:100%}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.sheet .ph{padding-block:14px 10px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.sheet .ph h2{font-size:24px}
.sheet .pb{overflow-y:auto;padding-block:12px 16px;flex:1}
.sheet .pf{border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface)}
.x{margin-left:auto;width:38px;height:38px;border-radius:50%;background:var(--sunk);font-size:22px;line-height:1;flex:none}
.pick{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.pick:last-child{border-bottom:0}
.pick input{width:22px;height:22px;accent-color:var(--accent)}
.pick .nm{font-weight:700}
.pick .sm{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.pick.off{opacity:.45}
.star{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--f-display);font-weight:800;color:var(--muted)}
.star[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1b1404}
.fit{width:54px}
.cnt{font-family:var(--f-display);font-size:22px}

/* toast e attesa */
.toasts{position:fixed;z-index:70;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .25s ease-out;transition:opacity .4s,transform .4s;text-align:center}
.toast.ok{background:var(--ok);color:#fff}.toast.bad{background:var(--danger);color:#fff}.toast.gold{background:var(--amber);color:#1b1404}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{transform:translateY(-10px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.busy{position:fixed;inset:0;z-index:80;background:color-mix(in srgb,var(--bg) 70%,transparent);display:grid;place-items:center}
.busybox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 24px;display:flex;gap:14px;align-items:center;font-weight:600;box-shadow:var(--shadow)}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--sunk);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* gara */
.race{position:fixed;inset:0;z-index:45;background:var(--bg);overflow-y:auto;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.race-grid{display:flex;flex-direction:column}
.rcol.rl{display:contents}
.race-h{order:0;position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.rcol.rr{order:1}.rl>.rbody{order:2}
.rbody{padding-block:12px;display:flex;flex-direction:column;gap:12px}
.rbody .eyebrow{margin-bottom:6px}
.race-h .wrap{padding-block:10px 8px}
.rh1 h2{font-size:20px}
.kmbig{display:flex;align-items:flex-end;gap:14px;margin-top:6px;flex-wrap:wrap}
.kmbig .k{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:.9}
.kmbig .k small{font-size:15px;font-weight:600;color:var(--muted);margin-left:3px}
.kmbig .o{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.kmbig .o b{display:block;color:var(--ink);font-family:var(--f-mono);font-size:14px;font-weight:500}
.prof{position:relative;margin-top:8px}
.prof canvas{display:block;width:100%;height:150px}
.zoom{position:absolute;right:0;top:0}
.grp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:0}
.grp .gn{font-family:var(--f-display);font-weight:700;font-size:16px}
.grp .gc{font-size:12.5px;color:var(--muted)}
.grp .gg{font-family:var(--f-mono);font-size:14px;text-align:right}
.grp .mine{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.mr{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.mr:last-child{border-bottom:0}
.mr .l1{display:flex;align-items:center;gap:8px}
.mr .l1 .nm{font-weight:700;font-size:15.5px}
.mr .l1 .where{margin-left:auto;font-size:13px;color:var(--muted);text-align:right}
.mr .bars{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;font-size:11.5px;color:var(--muted)}
.mr .bars>div{display:flex;flex-direction:column;gap:3px}
.pwv{font-size:13px;color:var(--ink);text-align:right;min-width:52px}
.orders{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.orders button{min-height:38px;border-radius:9px;background:var(--sunk);font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase}
.orders button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.orders button.atk{color:var(--danger)}
.orders button.atk[aria-pressed="true"]{background:var(--danger);color:#fff}
.orders button:disabled{opacity:.35}
.radio{display:flex;flex-direction:column;font-size:13.5px}
.radio div{padding:6px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:52px 1fr;gap:8px}
.radio div:last-child{border-bottom:0}
.radio .km{font-family:var(--f-mono);color:var(--muted);font-size:12.5px}
